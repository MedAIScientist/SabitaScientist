# ── Curator PACS search (Kubernetes cluster) as a SUBPATH of the apex host ──────────────
#   medai.medipol.edu.tr/pacs  →  Cilium Gateway 172.20.43.241  →  curator-frontend (SPA+proxy)
#
# Same fragment pattern as cvat.conf (see its header for WHY a location fragment and not a
# server block, and why subpaths are the only TLS-valid option). Curator differs from CVAT in
# one pleasant way: it is base-path-native (the Go server serves /pacs and emits /pacs/...
# redirects itself), so no proxy_redirect rewriting is needed here.
location /pacs/ {
    # Forward the ORIGINAL path; the cluster side owns the /pacs prefix end to end.
    proxy_pass https://172.20.43.241;

    # TLS to the cluster: pinned to the long-lived internal CA (not the 90-day leaf).
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/conf.d/trust/sabita-internal-ca.pem;
    proxy_ssl_verify_depth        2;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_server_name         on;
    proxy_ssl_name                medai.medipol.edu.tr;

    proxy_set_header Host              medai.medipol.edu.tr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    # Appends the real client IP; Curator's rate limiter keys on the rightmost
    # non-trusted-proxy hop of this chain, so floods are attributed to the actual caller.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # Search POSTs are small JSON; a building 5-year range answers in milliseconds from the
    # local cache path, and a direct archive scan is wall-clock-capped at 25s cluster-side.
    proxy_connect_timeout 15s;
    proxy_send_timeout    60s;
    proxy_read_timeout    90s;
}

# /pacs without the trailing slash: the cluster's Go server would 302 it itself, but nginx's
# location /pacs/ above wouldn't match the bare path — redirect here for clean bookmarks.
location = /pacs {
    return 302 /pacs/;
}
