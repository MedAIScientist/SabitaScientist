events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # WebSocket upgrade helper. `map` is only valid in the http context, so it cannot
    # live in a conf.d location fragment. Yields "upgrade" for a websocket handshake and
    # "close" otherwise, so ordinary HTTP requests are never told to upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
