# WebSocket upgrade map (http context — conf.d/*.conf is included inside http{}).
# $connection_upgrade is "upgrade" only when the client actually asks to upgrade, and "close"
# otherwise — the safe conditional form. An UNCONDITIONAL `Connection "upgrade"` on every proxied
# request is the classic mistake (breaks keep-alive and confuses upstreams), which is why
# cvat.conf deliberately deferred WebSockets until this map existed. Named 00- so it is defined
# before any location fragment that references it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
