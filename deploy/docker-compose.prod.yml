# Production deployment — single compose file for all services
name: gazzali
x-shared: &shared
  env_file:
    - ../.env
    - .env
  restart: unless-stopped

services:
  gazzali:
    <<: *shared
    build:
      context: ..
      dockerfile: Dockerfile
    image: gazzali:prod
    container_name: gazzali
    expose:
      - "7860"
      - "8001"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      - GAZZALI_PM_DB=/data/pm.db
      - GAZZALI_WORKSPACE_DIR=/data/workspaces
      - GARAGE_S3_ENDPOINT=${GARAGE_S3_ENDPOINT:-http://garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
      - GARAGE_BUCKET=${GARAGE_BUCKET:-gazzali}
    # platform-control desired-state pushes (DMZ -> cluster): the hostname
    # resolves to the cluster gateway VIP only inside this container (public DNS
    # for it points back at this very host's nginx, which has no location for
    # it), and the gateway's cert chains to the pinned internal CA below.
    extra_hosts:
      - "platform.medai.medipol.edu.tr:172.20.43.241"
    volumes:
      - gazzali-data:/data
      - gazzali-home:/home/gazzali/.gazzali
      - /home/medaiadm/sabita-internal-ca.pem:/etc/ssl/sabita-internal-ca.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - gazzali-net

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: gazzali-garage
    expose:
      - "3900"
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
    volumes:
      - garage-data:/data
      - ../garage.toml:/etc/garage.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - gazzali-net

  nginx:
    image: nginx:alpine
    container_name: gazzali-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - gazzali
    networks:
      - gazzali-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # AutoResearchClaw worker (plan/autoresearchclaw-integration.md). Internal only:
  # no published port, no Docker socket. Experiments run CPU-only inside it.
  researchclaw:
    <<: *shared
    build:
      context: researchclaw
    image: researchclaw-worker:prod
    container_name: researchclaw
    expose:
      - "8100"
    environment:
      - ARC_TIME_BUDGET_SEC=${ARC_TIME_BUDGET_SEC:-900}
    volumes:
      - researchclaw-runs:/runs
      # IRB-approved datasets; the PM only starts a run on one after checking the approval.
      - /home/medaiadm/arc-datasets:/datasets:ro
    cpus: 4
    mem_limit: 6g
    pids_limit: 512
    networks:
      - gazzali-net

volumes:
  gazzali-data:
  gazzali-home:
  garage-data:
  researchclaw-runs:

networks:
  gazzali-net:
    driver: bridge
    # Pinned: Docker's next free /16 was 172.20.0.0/16, which contains the cluster
    # gateway (platform.medai.medipol.edu.tr = 172.20.43.241) and broke routing to it.
    ipam:
      config:
        - subnet: 172.19.0.0/16
