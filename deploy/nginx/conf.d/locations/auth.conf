# ── Authentik (identity provider, Kubernetes) published as a SUBPATH of the apex ────────
#   medai.medipol.edu.tr/auth/  →  Cilium Gateway 172.20.43.241  →  authentik-server:80
#
# WHY A SUBPATH: the public certificate is a Sectigo wildcard for *.medipol.edu.tr and a DNS
# wildcard matches exactly ONE label, so auth.medai.medipol.edu.tr can never have
# browser-valid TLS. Same constraint that put CVAT on /cvat.
#
# WHY THIS IS THE IdP AND NOT THE ONE IN deploy/docker-compose.authentik.yml:
# the hospital firewall permits DMZ → 172.20.43.241 but NOTHING from the cluster back to the
# DMZ (verified 2026-08-07: cluster → DMZ 443/80/22/3900 all filtered). CVAT lives in the
# cluster, so a DMZ-hosted IdP could never complete an authorization-code exchange. A
# cluster-hosted IdP is reachable by BOTH parties: CVAT in-cluster, Medai over .241.
# The compose file stays stopped on purpose — two Authentiks would be two disagreeing
# sources of identity.
location /auth/ {
    # No URI part after the host, so the original /auth/... path is forwarded unchanged.
    # Authentik runs with AUTHENTIK_WEB__PATH=/auth/, which mounts its entire Django url conf
    # under "auth/" and sets STATIC_URL=/auth/static/ — it EXPECTS the prefix. A trailing
    # slash here ("...241/") would strip it and 404 every route and asset.
    proxy_pass https://172.20.43.241;

    # ── TLS to the cluster: verified against our own internal CA ──────────────────────
    # The CA is pinned, never the leaf: the Gateway's leaf auto-renews every 90 days while
    # this CA is valid to 2036, and the firewall makes cluster → DMZ delivery impossible.
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/conf.d/trust/sabita-internal-ca.pem;
    proxy_ssl_verify_depth        2;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    # We connect to a bare IP, so SNI must be explicit or the Gateway cannot pick a listener.
    proxy_ssl_server_name         on;
    proxy_ssl_name                medai.medipol.edu.tr;

    # ── Headers ──────────────────────────────────────────────────────────────────────
    # Host is the LITERAL apex: the HTTPRoute matches on it, and Authentik builds its OIDC
    # issuer, authorize and redirect URLs from the incoming host — if this were wrong, every
    # discovery document would advertise unreachable endpoints.
    proxy_set_header Host              medai.medipol.edu.tr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme; # https — or Authentik emits http:// URLs
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # ── WebSockets ───────────────────────────────────────────────────────────────────
    # Authentik routes websockets under web.path (authentik/root/websocket.py) and its admin
    # interface uses them for live updates. $connection_upgrade comes from the `map` added to
    # nginx.conf's http block — a `map` is only valid in the http context, which is why this
    # could not live in a location fragment alone. Using the map (not a literal "upgrade")
    # means plain HTTP requests are NOT told to upgrade.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long-lived websockets; the 60s default would drop them every minute.
    proxy_connect_timeout 15s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
}

# Bare /auth (no trailing slash) does not match `location /auth/`, so without this it would
# fall through to `location /` and silently serve the Medai SPA — the same false-positive
# trap that a peer server block causes. Redirect it explicitly.
location = /auth {
    return 301 /auth/;
}
