# ── CVAT (Kubernetes cluster) published as a SUBPATH of the apex host ───────────────────
#   medai.medipol.edu.tr/cvat  →  Cilium Gateway 172.20.43.241  →  cvat-backend-service:8080
#
# WHY A LOCATION FRAGMENT AND NOT ITS OWN `server` BLOCK
#   medai.conf already owns `server_name medai.medipol.edu.tr` on :443. A second server
#   block with the same listen+server_name is SILENTLY DISCARDED:
#       [warn] conflicting server name "medai.medipol.edu.tr" on 0.0.0.0:443, ignored
#       nginx: configuration file test is successful      ← -t still PASSES
#   /cvat/ would then fall through to medai.conf's `location /` and serve Medai's SPA HTML
#   with a 200 — a failure that looks exactly like success. Verified experimentally in a
#   throwaway container on 2026-08-06. Hence: one fragment per service here, and medai.conf
#   gains exactly one line, once, ever:
#       include /etc/nginx/conf.d/locations/*.conf;
#
# WHY A SUBPATH AND NOT cvat.medai.medipol.edu.tr
#   The public certificate is a Sectigo wildcard for *.medipol.edu.tr, and a DNS wildcard
#   matches exactly ONE label. medai.medipol.edu.tr is covered; cvat.medai.medipol.edu.tr is
#   two labels deep and can never have browser-valid TLS. Subpaths are not a preference here,
#   they are the only option.
#
# SCOPE — PHASE 1 IS API ONLY
#   The Gateway routes only /cvat/api today (04-httproute-cvat-subpath.yaml). The browser UI
#   (/cvat/ itself, /static, /admin) deliberately 404s at the Gateway until the base-path CVAT
#   images are deployed: a half-routed SPA serves its HTML and then 404s every asset, which
#   looks like it works and does not.
location /cvat/ {
    # No URI part after the host, so nginx forwards the ORIGINAL path (/cvat/api/...)
    # unchanged and the Gateway's HTTPRoute strips the prefix itself. Writing
    # "https://172.20.43.241/" instead would strip /cvat/ HERE, the Gateway would see
    # /api/... , match no route, and return 404.
    proxy_pass https://172.20.43.241;

    # ── TLS to the cluster: verified, pinned to our own internal CA ────────────────────
    # The CA is pinned rather than the leaf, deliberately. The Gateway's leaf auto-renews
    # every 90 days; this CA is valid to 2036 and its key never rotates. A leaf pin would
    # have turned every /cvat request into a 502 on the first renewal, and the firewall
    # blocks cluster → DMZ, so nothing could have delivered a fresh copy here automatically.
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/conf.d/trust/sabita-internal-ca.pem;
    proxy_ssl_verify_depth        2;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    # We connect to a bare IP, so SNI must be set explicitly: without it the Gateway cannot
    # select a listener, and the hostname check would be made against the IP and fail.
    proxy_ssl_server_name         on;
    proxy_ssl_name                medai.medipol.edu.tr;

    # ── Headers ────────────────────────────────────────────────────────────────────────
    # Host is the LITERAL apex rather than $host: the Gateway's HTTPRoute matches on this
    # hostname and CVAT builds absolute URLs from it, so a request arriving with any other
    # Host (by IP, say) must still be routed correctly.
    proxy_set_header Host              medai.medipol.edu.tr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # Upstream CVAT v2.69 has no base-path support and the Gateway strips /cvat, so any
    # redirect CVAT emits points at /api/... — which does not exist on the DMZ. Put the
    # prefix back on the way out.
    # ⚠ PHASE 2: when the base-path images land, CVAT will emit /cvat/... itself and these
    #   two lines must be DELETED, or Location headers become /cvat/cvat/...
    proxy_redirect https://172.20.43.241/ /cvat/;
    proxy_redirect /                      /cvat/;

    # ── Large dataset uploads (POST /cvat/api/tasks/{id}/data) ─────────────────────────
    # Unlimited body size, as upstream CVAT requires. Streamed straight to the cluster
    # instead of being spooled to disk first, so a multi-GB upload cannot fill the DMZ's
    # filesystem while it is in flight.
    client_max_body_size    0;
    proxy_request_buffering off;

    # Imports, exports and dataset processing are slow; nginx's default 60s read timeout
    # would abort them mid-flight and look like a CVAT bug.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ── PHASE 2 (browser UI) — intentionally NOT enabled ───────────────────────────────
    # Both of these require the `http` context, i.e. an edit to nginx.conf, which Phase 1
    # does not touch:
    #   • WebSockets: map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    #     then proxy_set_header Upgrade $http_upgrade; Connection $connection_upgrade;
    #     An UNCONDITIONAL `Connection "upgrade"` is wrong here — it would be sent on plain
    #     JSON API calls too, and this upstream is Envoy, not the FastAPI app.
    #   • Upstream keepalive: upstream cvat_gw { server 172.20.43.241:443; keepalive 16; }
    #     Without it every API call pays a fresh TLS handshake to the cluster.
}
