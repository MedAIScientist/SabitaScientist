# ── JupyterHub (Kubernetes cluster) as a SUBPATH of the apex host ────────────────────────
#   medai.medipol.edu.tr/jupyter  →  Cilium Gateway 172.20.43.241  →  proxy-public (hub)
# Same fragment pattern as pacs.conf (see cvat.conf's header for the server-block trap and the
# subpath-only TLS reality). Jupyter is base-path-native (hub.baseUrl=/jupyter) — no rewrites.
# DIFFERS from the others in one essential: notebooks need WEBSOCKETS (kernel channels), hence
# the Upgrade/Connection headers via the $connection_upgrade map (00-websocket-map.conf).
location /jupyter/ {
    proxy_pass https://172.20.43.241;

    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/conf.d/trust/sabita-internal-ca.pem;
    proxy_ssl_verify_depth        2;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_server_name         on;
    proxy_ssl_name                medai.medipol.edu.tr;

    proxy_set_header Host              medai.medipol.edu.tr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # WebSockets: conditional upgrade (kernel/terminal channels); harmless for plain requests.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Kernels hold long-lived connections; the default 60s read timeout would sever idle
    # websockets and look like dead kernels. Notebook uploads can be large-ish.
    proxy_read_timeout    3600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 15s;
    client_max_body_size  256m;
}

location = /jupyter {
    return 302 /jupyter/;
}
