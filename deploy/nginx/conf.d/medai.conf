server {
    listen 80;
    server_name medai.medipol.edu.tr;

    # The container healthcheck probes http://localhost/nginx-health. Answer it
    # here: following the HTTPS redirect fails TLS (cert is not for "localhost").
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name medai.medipol.edu.tr;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Subpath routes for cluster-hosted services (see locations/*.conf)
    include /etc/nginx/conf.d/locations/*.conf;

    location / {
        proxy_pass http://evoscientist:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
