# Production deployment for Gazzali Research Ecosystem.
# Usage:
#   cp .env deploy/.env && vim deploy/.env   # set API keys
#   docker compose -f deploy/docker-compose.yml up -d
#
# With SSL (requires cert.pem + key.pem in deploy/nginx/ssl/):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ssl.yml up -d

x-shared: &shared
  env_file:
    - ../.env
    - .env
  restart: unless-stopped

services:
  # ── Main application: PM API + SPA + Agent Runner ──────────────────────────
  gazzali:
    <<: *shared
    build:
      context: ..
      dockerfile: Dockerfile
    image: gazzali:prod
    container_name: gazzali
    entrypoint: ["tini", "--", "gazzali"]
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    ports:
      - "7860:7860"
      - "8001:8001"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      - GAZZALI_PM_DB=/data/pm.db
      - GAZZALI_WORKSPACE_DIR=/data/workspaces
      - GARAGE_S3_ENDPOINT=${GARAGE_S3_ENDPOINT:-http://garage:3900}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
      - GARAGE_BUCKET=${GARAGE_BUCKET:-gazzali}
    volumes:
      - gazzali-prod-data:/data
      - gazzali-home:/home/gazzali/.gazzali
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── S3-compatible object storage for file attachments ──────────────────────
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: gazzali-garage
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
    volumes:
      - garage-prod-data:/data
      - ../garage.toml:/etc/garage.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  gazzali-prod-data:
  gazzali-home:
  garage-prod-data:
