[project]
name = "gazzali"
version = "1.0.0"
description = "Gazzali: research management platform for university labs (projects, supervision, publications, AI)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.28",
    "bcrypt>=4.0",
    "pyjwt[crypto]>=2.8",
    "boto3>=1.34",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "langchain-core>=1.0",
    "langchain-openai>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5",
    "build>=1.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
gazzali = "gazzali.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gazzali*"]

[tool.setuptools.package-data]
gazzali = [
    "frontend/dist/**/*",
    "templates/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (Error & Warning)
    "F",       # Pyflakes (Logical errors)
    "I",       # isort (Import sorting)
    "B",       # flake8-bugbear (Common bugs)
    "C4",      # flake8-comprehensions (List/Dict perf)
    "UP",      # pyupgrade (Modern Python syntax)
    "PT",      # flake8-pytest-style (If using Pytest)
    "PLE",     # Pylint Error
    "RUF",     # Ruff specific rules
    "FURB",    # Refurb rules
]
ignore = [
    "E501", # Formatter takes care of that
    "B008", # FastAPI uses Depends() in function default args by design
]
fixable = ["ALL"]
unfixable = []
allowed-confusables = ["–", "❯", "：", "（", "）", "，", "ı", "ğ", "ü", "ş", "ö", "ç", "İ", "Ğ", "Ü", "Ş", "Ö", "Ç"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
